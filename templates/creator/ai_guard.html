{% extends 'base.html' %}

{% block title %}Comment Guard & Spam Protection — MonkHQ{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-extrabold text-slate-900">Comment Guard & Frequency Protection</h1>
        <p class="text-sm text-slate-500">Prevent excessive automation replies, spam attacks, and Meta API rate-limiting.</p>
    </div>

    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Max Replies Per Hour</label>
                <input type="number" value="{{ guard.max_replies_per_hour|default:30 }}" class="w-full px-4 py-2 border rounded-xl text-xs font-bold" readonly>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Max DMs Per User Per Day</label>
                <input type="number" value="{{ guard.max_dms_per_user_day|default:3 }}" class="w-full px-4 py-2 border rounded-xl text-xs font-bold" readonly>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Blocked Spam Keywords</label>
            <textarea rows="3" class="w-full p-4 border rounded-xl text-xs font-mono" readonly>{{ guard.spam_keywords|default:"crypto, scam, dm me, follower growth" }}</textarea>
        </div>
    </div>
</div>
{% endblock %}
