{% extends 'base_public.html' %}

{% block title %}Brand Sign Up — MonkHQ{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] bg-[#f5f5fa] flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans">
    
    <!-- Header Logo & Title -->
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center space-y-3">
        <a href="{% url 'home' %}" class="inline-flex items-center gap-2.5 group">
            <div class="relative w-12 h-12 rounded-2xl bg-slate-900 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-slate-900/25 group-hover:scale-105 transition">
                M
                <span class="w-3 h-3 rounded-full bg-blue-500 border-2 border-white absolute -top-0.5 -right-0.5 animate-pulse"></span>
            </div>
            <span class="text-2xl font-black tracking-tight text-slate-950">MonkHQ</span>
        </a>

        <div>
            <h2 class="text-2xl font-black text-slate-950 tracking-tight">Create Brand Workspace</h2>
            <p class="text-xs font-medium text-slate-500 mt-1">Sponsor creator promotions, launch campaigns, and track ROI.</p>
        </div>
    </div>

    <!-- Signup Card -->
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/60 rounded-3xl border border-slate-200/90 sm:px-10 space-y-5">
            
            <form class="space-y-4" method="POST">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Brand Name</label>
                        <input type="text" name="company_name" placeholder="Acme Inc." required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Industry</label>
                        <input type="text" name="industry" placeholder="E-Commerce, Tech..." required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Username</label>
                    <input type="text" name="username" placeholder="acme_official" required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Work Email</label>
                    <input type="email" name="email" placeholder="marketing@acme.com" required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                        <input type="password" name="password" placeholder="••••••••" required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Confirm Password</label>
                        <input type="password" name="confirm_password" placeholder="••••••••" required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-black text-xs uppercase tracking-wider rounded-full shadow-lg shadow-slate-900/25 transition transform hover:-translate-y-0.5">
                        Register Brand Account
                    </button>
                </div>
            </form>

            <div class="pt-4 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500 font-medium">
                    Already registered?
                    <a href="{% url 'brand_login' %}" class="font-extrabold text-slate-900 hover:underline">Log in to Brand Portal</a>
                </p>
            </div>

        </div>
    </div>

</div>
{% endblock %}
