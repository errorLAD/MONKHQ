{% extends 'base_public.html' %}

{% block title %}Super Admin Sign In — MonkHQ{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] bg-[#f5f5fa] flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans">
    
    <!-- Header Logo & Title -->
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center space-y-3">
        <a href="{% url 'home' %}" class="inline-flex items-center gap-2.5 group">
            <div class="relative w-12 h-12 rounded-2xl bg-gradient-to-r from-slate-900 to-rose-950 flex items-center justify-center text-white font-black text-xs tracking-wider shadow-lg shadow-rose-900/20 group-hover:scale-105 transition">
                M
                <span class="w-3 h-3 rounded-full bg-rose-500 border-2 border-white absolute -top-0.5 -right-0.5 animate-pulse"></span>
            </div>
            <span class="text-2xl font-black tracking-tight text-slate-950">MonkHQ</span>
        </a>

        <div>
            <h2 class="text-2xl font-black text-slate-950 tracking-tight">Platform Admin Security Portal</h2>
            <p class="text-xs font-semibold text-rose-600 uppercase tracking-wider mt-1">Restricted System Control Access</p>
        </div>
    </div>

    <!-- Login Card -->
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/60 rounded-3xl border border-slate-200/90 sm:px-10 space-y-6">
            
            <form class="space-y-4" method="POST">
                {% csrf_token %}
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Admin Username</label>
                    <input type="text" name="username" placeholder="admin_super" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-rose-600 focus:border-rose-600">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600">Security Key / Password</label>
                    </div>
                    <input type="password" name="password" placeholder="••••••••" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-rose-600 focus:border-rose-600">
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded text-rose-600 focus:ring-rose-600">
                        <span class="text-xs text-slate-600 font-medium">Keep admin session active</span>
                    </label>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-slate-900 to-rose-900 hover:opacity-95 text-white font-black text-xs uppercase tracking-wider rounded-full shadow-lg shadow-rose-900/25 transition transform hover:-translate-y-0.5">
                    Authenticate Super Admin
                </button>
            </form>

            <div class="pt-4 border-t border-slate-100 text-center">
                <a href="{% url 'home' %}" class="text-xs font-bold text-slate-500 hover:text-slate-900">
                    ← Return to Home
                </a>
            </div>

        </div>
    </div>

</div>
{% endblock %}
