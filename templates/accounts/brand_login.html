{% extends 'base_public.html' %}

{% block title %}Brand Sign In — MonkHQ{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] bg-[#f5f5fa] flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans">
    
    <!-- Header Logo & Title -->
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center space-y-3">
        <a href="{% url 'home' %}" class="inline-flex items-center gap-2.5 group">
            <div class="relative w-12 h-12 rounded-2xl bg-slate-900 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-slate-900/25 group-hover:scale-105 transition">
                M
                <span class="w-3 h-3 rounded-full bg-blue-500 border-2 border-white absolute -top-0.5 -right-0.5 animate-pulse"></span>
            </div>
            <span class="text-2xl font-black tracking-tight text-slate-950">MonkHQ</span>
        </a>

        <div>
            <h2 class="text-2xl font-black text-slate-950 tracking-tight">Brand Workspace Sign In</h2>
            <p class="text-xs font-medium text-slate-500 mt-1">Log in to manage creator sponsorships, campaigns, and ROI metrics.</p>
        </div>
    </div>

    <!-- Login Card -->
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/60 rounded-3xl border border-slate-200/90 sm:px-10 space-y-6">
            
            <!-- Login Form -->
            <form class="space-y-4" method="POST">
                {% csrf_token %}
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Brand Username or Work Email</label>
                    <input type="text" name="username" placeholder="brand_admin or manager@brand.com" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600">Password</label>
                        <a href="mailto:support@monkhq.in?subject=MonkHQ%20Brand%20Password%20Reset" class="text-[11px] font-bold text-slate-700 hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" name="password" placeholder="••••••••" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-slate-900 focus:border-slate-900">
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded text-slate-900 focus:ring-slate-900">
                        <span class="text-xs text-slate-600 font-medium">Remember me</span>
                    </label>
                </div>

                <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-black text-xs uppercase tracking-wider rounded-full shadow-lg shadow-slate-900/25 transition transform hover:-translate-y-0.5">
                    Sign In to Brand Dashboard
                </button>
            </form>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs">
                <a href="{% url 'brand_signup' %}" class="font-extrabold text-slate-900 hover:underline">Create Brand Account</a>
                <a href="{% url 'creator_login' %}" class="font-bold text-slate-500 hover:text-slate-900">Creator Login →</a>
            </div>

        </div>
    </div>

</div>
{% endblock %}
