{% extends 'base.html' %}

{% block title %}Brand Billing — MonkHQ{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-extrabold text-slate-900">Brand Subscription & Escrow Billing</h1>
        <p class="text-sm text-slate-500">Manage campaign budgets and subscription plans.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        {% for plan in plans %}
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="text-lg font-extrabold text-slate-900">{{ plan.name }}</h3>
                <p class="text-2xl font-black text-indigo-600">${{ plan.price_monthly }}<span class="text-xs font-normal text-slate-400">/mo</span></p>
                <button onclick="alert('Selected brand plan: {{ plan.name }}');" class="w-full py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl">
                    Choose Plan
                </button>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
