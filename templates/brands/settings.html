{% extends 'base.html' %}

{% block title %}Brand Settings — MonkHQ{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-extrabold text-slate-900">Brand Company Settings</h1>
        <p class="text-sm text-slate-500">Manage company name, industry, and workspace preferences.</p>
    </div>

    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Company / Brand Name</label>
                <input type="text" name="company_name" value="{{ request.user.brand_profile.company_name|default:request.user.username }}" class="w-full px-4 py-2 border rounded-xl text-xs font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Industry</label>
                <input type="text" name="industry" value="{{ request.user.brand_profile.industry|default:'E-Commerce' }}" class="w-full px-4 py-2 border rounded-xl text-xs font-medium">
            </div>

            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow">
                Save Brand Settings
            </button>
        </form>
    </div>
</div>
{% endblock %}
