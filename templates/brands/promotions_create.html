{% extends 'base.html' %}

{% block title %}Create Promotion Deal — MonkHQ{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-extrabold text-slate-900">Create Brand Promotion Deal</h1>
        <p class="text-sm text-slate-500">Publish campaign opportunities to the Creator Marketplace.</p>
    </div>

    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Promotion Title</label>
                <input type="text" name="title" placeholder="e.g. Summer Audio Gear Showcase 2026" class="w-full px-4 py-2.5 border rounded-xl text-xs font-semibold focus:ring-2 focus:ring-indigo-600" required>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Category</label>
                <input type="text" name="category" placeholder="Fashion, Tech, Lifestyle" class="w-full px-4 py-2.5 border rounded-xl text-xs font-semibold focus:ring-2 focus:ring-indigo-600" required>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Campaign Description & Requirements</label>
                <textarea name="description" rows="4" placeholder="Describe the campaign objectives, deliverables, brand guidelines..." class="w-full p-3 border rounded-xl text-xs font-medium focus:ring-2 focus:ring-indigo-600" required></textarea>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Budget ($)</label>
                    <input type="number" step="0.01" name="budget" placeholder="1500" class="w-full px-3 py-2 border rounded-xl text-xs font-bold" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Min Followers</label>
                    <input type="number" name="min_followers" placeholder="10000" class="w-full px-3 py-2 border rounded-xl text-xs font-bold" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Compensation Type</label>
                    <select name="compensation_type" class="w-full px-3 py-2 border rounded-xl text-xs font-semibold">
                        <option value="FIXED">Fixed Pay</option>
                        <option value="COMMISSION">Commission Per Sale</option>
                        <option value="HYBRID" selected>Fixed + Commission</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md">
                Publish Promotion to Creator Marketplace
            </button>
        </form>
    </div>
</div>
{% endblock %}
